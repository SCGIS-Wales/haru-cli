[project]
name = "haru-cli"
version = "0.1.1"
description = "Secure, scriptable CLI for Amazon Bedrock Claude models via the AWS Strands Agents SDK."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "haru-cli maintainers" }]
keywords = ["bedrock", "claude", "strands", "agents", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "strands-agents>=1.42.0",
  "strands-agents-tools>=0.2.0",
  "boto3>=1.43.0",
  "botocore>=1.43.0",
  "click>=8.2.0",
  "pyyaml>=6.0.2",
  "pydantic>=2.9.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "rich>=13.9.0",
]

[project.scripts]
haru = "haru.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-mock>=3.14",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto>=5.0",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haru"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PL", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest uses bare asserts. S105/S106/S107: tests exercise secret
# handling with deliberately fake credential strings.
"tests/**" = ["S101", "PLR2004", "S105", "S106", "S107"]

[tool.ruff.lint.isort]
known-first-party = ["haru"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# boto3/botocore ship no type information; clients are typed as Any at the
# auth module boundary, where all errors are converted to haru exceptions.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing --cov-fail-under=90 --strict-markers"
testpaths = ["tests"]
markers = ["integration: integration tests (deselect with -m 'not integration')"]

[tool.coverage.run]
source = ["src/haru"]
branch = true

[tool.coverage.paths]
haru = ["src/haru", "*/site-packages/haru"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
