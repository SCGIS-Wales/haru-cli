app:
  name: haru
  default_command: chat
auth:
  sso:
    start_url: https://d-9067b505265.awsapps.com/start
    sso_region: us-east-1
    registration_scopes:
      - sso:account:access
    client_name: haru-cli
    # Optional pins. When unset, your AWS account and role are discovered
    # during 'haru login' (browser sign-in) and remembered.
    # account_id: "123456789012"
    # role_name: HaruBedrockInvoke
    callback_port: 0            # 0 selects an ephemeral loopback port
    browser: true
  bedrock_region: us-east-1
includes:
  models: models.yaml
  agents: agents.yaml
  mcp: mcp.yaml
  guardrails: guardrails.yaml
  logging: logging.yaml
